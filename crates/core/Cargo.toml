[package]
name = "berthq-core"
description = "Queues, delivery, retries and storage for Berthq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Embedded ACID storage, pure Rust (see docs/spec.md decisions).
redb = "4"
# Free disk space for --min-free-disk; std can't read it.
fs4 = { version = "1.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Sortable, timestamped message ids.
ulid = { version = "3", default-features = false }

[lints]
workspace = true
