name: Release

# Push a tag like `v0.1.0` to publish the Docker image and build binaries into a draft GitHub
# release. Every artifact gets a GitHub build attestation, so users can check it was built
# here: `gh attestation verify <file or oci://image> --owner talovicnedim`. When both succeed,
# the Go SDK gets its own tag (`sdks/go/v0.1.0`), because it is a nested Go module.
on:
  push:
    tags: ['v*']

# Actions are pinned to commit SHAs and nothing is restored from a cache: this workflow publishes
# what users run, and a cache entry written by another run could change it.
permissions:
  contents: read

jobs:
  # The release is named after the tag, but `berthq --version` and the SDK packages carry the
  # version in the code, so they must all match before anything is built.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the tag matches every version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "berthq-cli") | .version')
          node=$(jq -r .version sdks/node/package.json)
          python=$(sed -n 's/^version = "\(.*\)"$/\1/p' sdks/python/pyproject.toml)
          python_module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sdks/python/berthq_client/__init__.py)
          for found in "Cargo.toml:$crate" "sdks/node/package.json:$node" \
            "sdks/python/pyproject.toml:$python" "sdks/python/berthq_client/__init__.py:$python_module"; do
            if [ "${found##*:}" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match ${found%%:*} (${found##*:})."
              exit 1
            fi
          done
          grep -Eq "^## ${tag//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no dated '## $tag (YYYY-MM-DD)' section."
            exit 1
          }

  draft:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Berthq $GITHUB_REF_NAME" \
            --notes "Docker: \`ghcr.io/talovicnedim/berthq:${GITHUB_REF_NAME#v}\`. Binaries are below."

  # Builds run third-party code (install scripts, build.rs), so they get no write access and no
  # signing token: they hand the archives to `assets`, which attests and uploads them.
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x86_64
          - platform: ubuntu-22.04-arm
            name: linux-arm64
          - platform: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The binary embeds the dashboard, so it's built first.
      - run: pnpm --filter dashboard build
      # Without the build, the binary still compiles and only shows "the dashboard is not built".
      - name: Check the dashboard build
        shell: bash
        run: |
          test -f apps/dashboard/build/index.html || {
            echo "::error::apps/dashboard/build/index.html is missing, so the binary would have no dashboard"
            exit 1
          }

      - name: Build
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.platform }}" = macos-latest ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p berthq-cli --target "$target"
            done
            lipo -create -output dist/berthq \
              target/aarch64-apple-darwin/release/berthq target/x86_64-apple-darwin/release/berthq
          else
            cargo build --release --locked -p berthq-cli
            cp target/release/berthq dist/berthq
          fi
          archive="berthq-$GITHUB_REF_NAME-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C dist berthq
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: berthq-*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # Runs no project code: it only attests the archives and uploads them to the draft release.
  assets:
    needs: [draft, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/berthq-*.tar.gz

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

  image:
    # Only publish `latest` and the version tag once every binary is on the draft release.
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # arm64 is built under emulation: slow, but one Dockerfile for both.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/talovicnedim/berthq
          # `latest` comes from the default `flavor: latest=auto`, which skips pre-releases
          # such as v0.2.0-rc.1. They also get only their full version as a tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/talovicnedim/berthq
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # `go get github.com/talovicnedim/berthq/sdks/go@v0.1.0` looks for the tag sdks/go/v0.1.0.
  go-module:
    needs: [assets, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the Go SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sdks/go/$GITHUB_REF_NAME"
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ "$existing" = "$commit" ]; then
            echo "$tag already points at $commit"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$commit"
