name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      # The install script runs on users' machines with plain sh; shellcheck comes with the runner.
      - run: shellcheck -s sh install.sh

  # `pnpm check` skips the Node, Python, Go and PHP SDKs. Their tests need a real broker, so
  # one job builds it and the SDK jobs download it to target/debug, where the tests look.
  berthq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo build --locked -p berthq-cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: berthq
          path: target/debug/berthq
          if-no-files-found: error
          retention-days: 1

  sdk-node:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: berthq
          path: target/debug
      # Artifacts don't keep the executable bit.
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sdk-python:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: berthq
          path: target/debug
      # Artifacts don't keep the executable bit. This also fails when the binary is missing,
      # which matters here: without it the Python tests are skipped, not failed.
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v

  sdk-go:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: berthq
          path: target/debug
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          # Standard library only: there is no go.sum to cache.
          cache: false

      # The Go tests don't start brokers themselves: they read their addresses from the env.
      - name: Start the test brokers
        run: |
          berthq="$GITHUB_WORKSPACE/target/debug/berthq"
          nohup "$berthq" start --port 7441 --data "$RUNNER_TEMP/open" > "$RUNNER_TEMP/open.log" 2>&1 &
          nohup "$berthq" start --port 7442 --data "$RUNNER_TEMP/auth" \
            --api-key adminadminadmin1 --api-key publish:publishpublish12 \
            > "$RUNNER_TEMP/auth.log" 2>&1 &
          for port in 7441 7442; do
            curl -fsS --retry 30 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$port/healthz"
          done
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          BERTHQ_TEST_URL: http://127.0.0.1:7441
          BERTHQ_TEST_AUTH_URL: http://127.0.0.1:7442

  sdk-php:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: berthq
          path: target/debug
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
