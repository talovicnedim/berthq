name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      # The install script runs on users' machines with plain sh; shellcheck comes with the runner.
      - run: shellcheck -s sh install.sh

  # `pnpm check` skips the Node, Python, Go and PHP SDKs. Their tests need a real broker, so
  # one job builds it and the SDK jobs download it to target/debug, where the tests look.
  berthq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo build --locked -p berthq-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: berthq
          path: target/debug/berthq
          if-no-files-found: error
          retention-days: 1

  sdk-node:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: berthq
          path: target/debug
      # Artifacts don't keep the executable bit.
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sdk-python:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: berthq
          path: target/debug
      # Artifacts don't keep the executable bit. This also fails when the binary is missing,
      # which matters here: without it the Python tests are skipped, not failed.
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v

  sdk-go:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: berthq
          path: target/debug
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          # Standard library only: there is no go.sum to cache.
          cache: false

      # The Go tests don't start brokers themselves: they read their addresses from the env.
      - name: Start the test brokers
        run: |
          berthq="$GITHUB_WORKSPACE/target/debug/berthq"
          nohup "$berthq" start --port 7441 --data "$RUNNER_TEMP/open" > "$RUNNER_TEMP/open.log" 2>&1 &
          nohup "$berthq" start --port 7442 --data "$RUNNER_TEMP/auth" \
            --api-key adminadminadmin1 --api-key publish:publishpublish12 \
            > "$RUNNER_TEMP/auth.log" 2>&1 &
          for port in 7441 7442; do
            curl -fsS --retry 30 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$port/healthz"
          done
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          BERTHQ_TEST_URL: http://127.0.0.1:7441
          BERTHQ_TEST_AUTH_URL: http://127.0.0.1:7442

  sdk-php:
    needs: berthq
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: berthq
          path: target/debug
      - run: chmod +x "$GITHUB_WORKSPACE/target/debug/berthq"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
